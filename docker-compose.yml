services:
  # =====================
  # Reverse Proxy (Nginx)
  # =====================
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

  # =====================
  # Application Web (Nuxt.js — production)
  # =====================
  web:
    build:
      context: .
      target: prod
    expose:
      - "3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
    volumes:
      - app_data:/app/.data
    env_file: ".env"
    restart: unless-stopped

  # =====================
  # GlitchTip Stack
  # =====================
  glitchtip-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip_password}
      POSTGRES_DB: glitchtip_db
    volumes:
      - glitchtip_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip-redis:
    image: redis:7-alpine
    volumes:
      - glitchtip_redis_data:/data
    restart: unless-stopped

  glitchtip-migrate:
    image: glitchtip/glitchtip:v4.1
    command: "./manage.py migrate"
    env_file: ".env"
    depends_on:
      glitchtip-db:
        condition: service_healthy
    restart: on-failure

  glitchtip:
    image: glitchtip/glitchtip:v4.1
    ports:
      - "8000:8000"
    env_file: ".env"
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
      glitchtip-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.1
    command: ./bin/run-celery-with-beat.sh
    env_file: ".env"
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    restart: unless-stopped

  # =====================
  # Umami Stack
  # =====================
  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami_password}
      POSTGRES_DB: umami_db
    volumes:
      - umami_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami_password}@umami-db:5432/umami_db
      APP_SECRET: ${UMAMI_APP_SECRET:-change_me_in_production_umami_secret}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  glitchtip_pg_data:
  glitchtip_redis_data:
  umami_pg_data:
